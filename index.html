<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Pecera de Estudio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2ef;--card:#fbfdfc;--ink:#2d3a3a;--mut:#6b7c7b;--ac:#4f9f9a;--line:#d5e3df;--warn:#e6a04f;--bad:#e0705f;--ok:#5fae83;--w1:#8fd3e6;--w2:#4fa9cf;--glass:#dff3f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#182224;--card:#223133;--ink:#e6f0ee;--mut:#9bb0ae;--ac:#6cc0ba;--line:#33494b;--glass:#1f3a40}}
:root[data-theme="dark"]{--bg:#182224;--card:#223133;--ink:#e6f0ee;--mut:#9bb0ae;--ac:#6cc0ba;--line:#33494b;--glass:#1f3a40}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:4px 0 12px;font-weight:600}h3{margin:0 0 6px;font-size:17px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
small,.mut{color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:130px;border:0;background:none;color:var(--mut);font:inherit;padding:8px 4px;border-radius:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
input,select,button{font:inherit}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:8px 14px;cursor:pointer}
.btn.g{background:none;color:var(--mut);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>span{flex:1;min-width:90px}
.row input[type=number]{width:72px}.row input.t{flex:1;min-width:100px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tank{position:relative;height:250px;border:7px solid var(--line);border-radius:26px 26px 44px 44px;background:var(--glass);overflow:hidden}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--w1),var(--w2));opacity:.85;transition:height 1.2s ease}
.fish{position:absolute;bottom:22%;width:54px;animation:sw 9s ease-in-out infinite alternate}
@keyframes sw{from{left:6%}to{left:72%}}
.sand{position:absolute;bottom:0;left:0;right:0;height:16px;background:#e9d8b4;border-radius:0 0 30px 30px}
.pet{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.pet svg{flex:none;transition:width .6s}.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px}
.eat{animation:bn .6s 2}@keyframes bn{50%{transform:translateY(-14px)}}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.al{border-radius:14px;padding:8px 12px;margin:6px 0;font-size:14px;background:color-mix(in srgb,var(--warn) 20%,var(--card))}.al.bad{background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.cats{display:flex;gap:8px;flex-wrap:wrap}.cats button{border:3px solid transparent;background:none;border-radius:16px;padding:0;cursor:pointer}.cats button.on{border-color:var(--ac)}
.done{text-decoration:line-through;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){.fish,.eat{animation:none}.fish{left:40%}}
</style></head><body><main id="app"></main><div id="toast"></div>
<nav id="nav"></nav>
<script>
const K='pecera_v1',$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{p:{t:'semestre',s:iso(new Date())},cat:{c:'#e8a45c',n:'Miso'},subs:[],tasks:[]};
let tab='home',eating=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)};
const COL=[['Naranja','#e8a45c'],['Gris','#9aa3ad'],['Negro','#3b3a42'],['Crema','#f1dfba']];
function cat(c,m,w){const ey=m=='happy'?'<path d="M35 48Q40 42 45 48M55 48Q60 42 65 48" stroke="#2b2530" stroke-width="3" fill="none" stroke-linecap="round"/>':'<circle cx="40" cy="47" r="3.6" fill="#2b2530"/><circle cx="60" cy="47" r="3.6" fill="#2b2530"/>';
const br=m=='warn'||m=='bad'?'<path d="M34 39L45 42M66 39L55 42" stroke="#2b2530" stroke-width="2.5" stroke-linecap="round"/>':'';
const tear=m=='bad'?'<ellipse cx="36" cy="55" rx="2.3" ry="3.6" fill="#7fc4e8"/>':'';
const mo=m=='happy'?'M43 62Q50 69 57 62':m=='ok'?'M45 63Q50 66 55 63':'M44 67Q50 61 56 67';
return `<svg class="${eating?'eat':''}" width="${w}" viewBox="0 0 100 100" aria-label="Gatito"><path d="M72 84Q96 80 90 56" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="78" rx="27" ry="19" fill="${c}"/><path d="M25 42L29 12L49 28ZM75 42L71 12L51 28Z" fill="${c}"/><circle cx="50" cy="50" r="27" fill="${c}"/><path d="M31 22L33 30L40 26Z M69 22L67 30L60 26Z" fill="#e58a9a" opacity=".6"/>${ey}${br}${tear}<path d="M47 55L53 55L50 59Z" fill="#e58a9a"/><path d="${mo}" stroke="#2b2530" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`}
function fish(m){const c=m=='sad'?'#8ea9bd':m=='warn'?'#f0b36a':'#f28c5c';
return `<svg class="fish" viewBox="0 0 60 40"><path d="M46 20L60 6V34Z" fill="${c}"/><ellipse cx="26" cy="20" rx="24" ry="14" fill="${c}"/><circle cx="14" cy="17" r="3.5" fill="#fff"/><circle cx="13" cy="17.5" r="1.7" fill="#2b2530"/><path d="${m=='happy'?'M8 25Q12 29 16 25':'M8 27Q12 23 16 27'}" stroke="#2b2530" stroke-width="1.6" fill="none"/>${m!='happy'?'<path d="M9 11L17 13" stroke="#2b2530" stroke-width="1.6"/>':''}</svg>`}
function calc(s){let W=0,A=0,tot=0;s.evs.forEach(e=>{tot+=+e.w;if(e.g!==null&&e.g!==''){W+=+e.w;A+=e.g*e.w/100}});
const rem=Math.max(0,tot-W),perf=W?A/W*100:null,need=rem>0?(s.min-A)/rem*100:null;let st='ok';
if(W){if(rem>0?need>100:A<s.min)st='bad';else if(perf<s.min||need>85)st='warn'}
return{W,A,tot,rem,perf,need,st}}
function growth(){const d=new Date(S.p.s+'T00:00'),e=new Date(d);e.setMonth(e.getMonth()+(S.p.t=='semestre'?6:4));
return Math.min(1,Math.max(0,(Date.now()-d)/(e-d)))}
const tState=t=>{if(t.done)return'done';const ms=new Date(t.due)-Date.now();return ms<0?'late':ms<864e5?'soon':'ok'};
function alerts(){const a=[];S.subs.forEach(s=>{const c=calc(s);
if(c.st=='bad')a.push(['bad',`🚨 ${esc(s.name)}: ${c.rem>0?'ni con 100 en lo que falta llegas al mínimo':'quedó por debajo del mínimo'}.`]);
else if(c.st=='warn')a.push(['',`⚠️ ${esc(s.name)}: ${c.need>0&&c.rem>0?'necesitas '+Math.ceil(c.need)+' en lo que falta.':'tu promedio está bajo el mínimo.'}`])});
S.tasks.forEach(t=>{const s=tState(t);if(s=='late')a.push(['bad',`🐟 "${esc(t.t)}" ya venció.`]);else if(s=='soon')a.push(['',`⏰ "${esc(t.t)}" vence en menos de 24 h.`])});return a}
function home(){const g=growth(),sc=S.subs.map(calc).filter(c=>c.W),avg=sc.length?sc.reduce((a,c)=>a+c.perf,0)/sc.length:null;
const worst=S.subs.some(s=>calc(s).st=='bad')?'bad':S.subs.some(s=>calc(s).st=='warn')?'warn':sc.length&&avg>=80?'happy':'ok';
const ts=S.tasks.map(tState),fm=ts.includes('late')?'sad':ts.includes('soon')?'warn':'happy';
const stage=g<.25?'bebé':g<.7?'joven':'adulto',w=Math.round(62+g*58),al=alerts();
const msg={bad:'Estoy muy preocupado… ¡hay una materia en peligro! Revisemos qué necesitas.',warn:'Uy, hay una materia que necesita atención. ¡Tú puedes!',happy:'¡Qué rico! Tus notas van geniales. 😻',ok:S.subs.length?'Todo tranquilo. Sube una nota y me la como.':'Crea una materia para que empecemos.'}[worst];
return `<h1>🐾 Pecera de ${esc(S.cat.n)}</h1>
<div class="tank" role="img" aria-label="Pecera: agua al ${Math.round(avg??10)}%"><div class="water" style="height:${Math.max(10,avg??10)}%">${fish(fm)}</div><div class="sand"></div></div>
<p class="mut" style="margin:6px 4px">Agua: ${avg==null?'sin notas aún':Math.round(avg)+'% de tu rendimiento'} · ${esc(S.cat.n)} y el pez son ${stage}s (${Math.round(g*100)}% del ${S.p.t}).</p>
<div class="pet">${cat(S.cat.c,worst,w)}<div class="bub">${msg}<br><small>${fm=='happy'?'El pez está feliz con tus tareas.':fm=='warn'?'El pez está nervioso: hay una entrega cerca.':'El pez está triste: tienes una tarea vencida.'}</small></div></div>
<h3 style="margin-top:16px">Avisos</h3>${al.length?al.map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join(''):'<div class="card mut">Sin avisos. Todo en orden. ✨</div>'}`}
function subs(){return `<h1>Materias</h1><div class="card"><h3>Nueva materia</h3><div class="row"><input class="t" id="sn" placeholder="Nombre (ej. Cálculo I)"><input type="number" id="sm" value="60" min="0" max="100" title="Nota mínima para aprobar"></div><small>Nota mínima para aprobar (sobre 100)</small><div class="row"><button class="btn" onclick="addSub()">Agregar materia</button></div></div>`+
S.subs.map((s,i)=>{const c=calc(s);return `<div class="card"><div class="row"><h3 style="flex:1;margin:0">${esc(s.name)} <small>mín ${s.min}</small></h3><button class="btn g" onclick="delSub(${i})" aria-label="Borrar materia">🗑</button></div>
<div class="bar"><i style="width:${Math.min(100,c.A)}%"></i></div><small>Acumulas ${c.A.toFixed(1)} de 100 pts${c.rem>0&&c.W?' · necesitas '+(c.need<=0?'nada más, ¡ya aprobaste!':Math.ceil(c.need)+' de promedio en el '+c.rem+'% restante'):''}${c.tot!=100?' · ⚠️ los porcentajes suman '+c.tot+'%':''}</small>
${s.evs.map((e,j)=>`<div class="row"><span>${esc(e.n)} <small>${e.w}%</small></span><input type="number" min="0" max="100" placeholder="nota" value="${e.g??''}" onchange="setG(${i},${j},this.value)" aria-label="Nota de ${esc(e.n)}"><button class="btn g" onclick="delEv(${i},${j})" aria-label="Quitar">✕</button></div>`).join('')}
<div class="row"><input class="t" id="en${i}" placeholder="Evaluación (Parcial 1)"><input type="number" id="ew${i}" placeholder="%" min="1" max="100"><button class="btn" onclick="addEv(${i})">+</button></div></div>`}).join('')}
function agenda(){const l=S.tasks.map((t,i)=>[t,i]).sort((a,b)=>a[0].done-b[0].done||new Date(a[0].due)-new Date(b[0].due));
return `<h1>Agenda</h1><div class="card"><h3>Nueva tarea</h3><div class="row"><input class="t" id="tt" placeholder="Ej. Taller de física"><select id="ts"><option value="">Sin materia</option>${S.subs.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="row"><input type="datetime-local" id="td"><button class="btn" onclick="addTask()">Agregar</button></div></div>`+
(l.length?l.map(([t,i])=>{const s=tState(t);return `<div class="card row"><input type="checkbox" ${t.done?'checked':''} onchange="togTask(${i})" aria-label="Entregada"><span class="${t.done?'done':''}">${esc(t.t)}<br><small>${t.s?esc(t.s)+' · ':''}${new Date(t.due).toLocaleString('es',{dateStyle:'medium',timeStyle:'short'})}${s=='late'?' · 🔴 vencida':s=='soon'?' · 🟠 pronto':''}</small></span><button class="btn g" onclick="delTask(${i})" aria-label="Borrar">🗑</button></div>`}).join(''):'<div class="card mut">Aún no tienes tareas. Agrega la primera y el pez te avisará.</div>')}
function sets(){return `<h1>Ajustes</h1><div class="card"><h3>Tu gatito</h3><div class="cats">${COL.map(([n,c])=>`<button class="${S.cat.c==c?'on':''}" onclick="setCat('${c}')" aria-label="${n}">${cat(c,'happy',64)}</button>`).join('')}</div><div class="row"><input class="t" value="${esc(S.cat.n)}" onchange="S.cat.n=this.value||'Miso';save();render()" aria-label="Nombre de la mascota"></div></div>
<div class="card"><h3>Periodo</h3><div class="row"><select onchange="S.p.t=this.value;save();render()"><option ${S.p.t=='semestre'?'selected':''}>semestre</option><option ${S.p.t=='cuatrimestre'?'selected':''}>cuatrimestre</option></select><input type="date" value="${S.p.s}" onchange="S.p.s=this.value||S.p.s;save();render()" aria-label="Fecha de inicio"></div><small>Las mascotas nacen el día de inicio y crecen hasta el final del periodo (6 meses el semestre, 4 el cuatrimestre).</small></div>
<div class="card"><button class="btn" style="background:var(--bad)" onclick="if(confirm('¿Borrar todos tus datos?')){S=null;try{localStorage.removeItem(K)}catch(e){}location.reload()}">Borrar todo</button></div>`}
const V={home,subs,agenda,sets},T=[['home','🐠 Pecera'],['subs','📚 Materias'],['agenda','📅 Agenda'],['sets','🐱 Ajustes']];
function render(){$('#app').innerHTML=V[tab]();$('#nav').innerHTML=T.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${n}</button>`).join('')}
function addSub(){const n=$('#sn').value.trim();if(!n)return toast('Escribe el nombre de la materia');S.subs.push({name:n,min:+$('#sm').value||60,evs:[]});save();render()}
function delSub(i){if(confirm('¿Borrar esta materia?')){S.subs.splice(i,1);save();render()}}
function addEv(i){const n=$('#en'+i).value.trim(),w=+$('#ew'+i).value;if(!n||!w)return toast('Pon el nombre y el porcentaje');S.subs[i].evs.push({n,w,g:null});save();render()}
function delEv(i,j){S.subs[i].evs.splice(j,1);save();render()}
function setG(i,j,v){S.subs[i].evs[j].g=v===''?null:Math.min(100,Math.max(0,+v));save();if(v!==''){eating=true;toast(`😻 ¡${S.cat.n} se comió tu nota!`)}render();eating=false}
function addTask(){const t=$('#tt').value.trim(),d=$('#td').value;if(!t||!d)return toast('Pon el nombre y la fecha');S.tasks.push({t,s:$('#ts').value,due:d,done:false});save();render()}
function togTask(i){const t=S.tasks[i];t.done=!t.done;if(t.done)toast(new Date(t.due)>=Date.now()?'🐟 ¡El pez está feliz, entregaste a tiempo!':'🐟 Entregada. ¡A la próxima a tiempo!');save();render()}
function delTask(i){S.tasks.splice(i,1);save();render()}
function setCat(c){S.cat.c=c;save();render()}
render();
</script></body></html>
